# Producer on GitHub's runners (like blocky-stories): a Claude session only researches the chain, checks the faces
# and commits episodes/<slug>/episode.json. This job then does the heavy part: prep, voice, render, QA, upload
# kit, and puts the video on the `queue` branch for upload.yml. No Claude usage is spent on rendering.
name: render
on:
  push:
    branches: [main]
    paths: ["episodes/*/episode.json"]
  pull_request:                       # producers open PRs: render + QA as a check, nothing is queued
    paths: ["episodes/*/episode.json"]
  workflow_dispatch:
    inputs:
      slug: {description: "episode folder to (re)render", required: true}
      enqueue: {description: "put it on the upload queue if QA passes", default: "true"}
concurrency: {group: render, cancel-in-progress: false}
permissions: {contents: write, issues: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-render.txt}
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pip install -r requirements-render.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('sixdeg/setup_models.py', 'data/assets.json') }}
      - uses: actions/cache@v4
        with:
          path: .cache
          key: wiki-cache-${{ github.run_id }}
          restore-keys: wiki-cache-
      - name: which episodes
        id: which
        run: |
          if [ -n "${{ inputs.slug }}" ]; then echo "slugs=${{ inputs.slug }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="origin/${{ github.base_ref }}"; else base="${{ github.event.before }}"; fi
          s=$(git diff --name-only "$base" "${{ github.sha }}" -- 'episodes/*/episode.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "slugs=$s" >> "$GITHUB_OUTPUT"
      - name: render, check, queue
        env:
          SLUGS: ${{ steps.which.outputs.slugs }}
          ENQUEUE: ${{ github.event_name == 'pull_request' && 'false' || inputs.enqueue || 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          python -m sixdeg setup
          python -c "from sixdeg import assets; assets.ensure()"
          fail=0
          for s in $SLUGS; do
            echo "::group::$s"
            if python -m sixdeg make "$s"; then
              if [ "$ENQUEUE" = "true" ]; then python -m sixdeg enqueue "$s" || true; fi
              echo "- ✅ $s: QA passed$( [ "$ENQUEUE" = "true" ] && echo ', queued')" >> "$GITHUB_STEP_SUMMARY"
            else
              fail=1; echo "- ❌ $s: QA failed (see episodes/$s/out/qa.json in the artifact)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ github.run_id }}
          path: |
            episodes/*/out/*.mp4
            episodes/*/out/qa.json
            episodes/*/out/contact.jpg
            episodes/*/out/upload.md
            episodes/*/work/review*.jpg
          retention-days: 14
      - name: report a failure
        if: failure() && github.event_name != 'pull_request'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh issue create --title "Render failed: ${{ steps.which.outputs.slugs }}" --body "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed. QA output and review images are in the artifact. A Claude session should fix episode.json (face pins, respellings) and push again."
