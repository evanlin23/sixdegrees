# Consumer: uploads the oldest videos on the `queue` branch to YouTube. Started by cron-job.org (GitHub's own
# `schedule:` has proven unreliable), like blocky-stories. Two modes:
#   privacy=public    (cron at ~11:22, ~18:22 and ~21:22 CT, max=1): goes live now, sets the thumbnail, posts the first comment
#   privacy=scheduled (one daily run, max=2): private until the next slot; comments are posted by a later run
# Run it by hand from the Actions tab too.
name: upload
on:
  workflow_dispatch:
    inputs:
      max: {description: "how many to upload", default: "2"}
      dry_run: {description: "true = don't upload, just show what would happen", default: "false"}
      privacy: {description: "public = go live now and post the first comment; scheduled = private until the next slot", default: ""}
concurrency: {group: upload, cancel-in-progress: false}
permissions: {contents: write, issues: write}
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests google-api-python-client google-auth
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ inputs.privacy || vars.YT_PRIVACY || 'scheduled' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          args="--max ${{ inputs.max || '2' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          python -m sixdeg consume $args | tee result.json
      - name: tell the owner
        if: success() && inputs.dry_run != 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python - <<'PY' > body.md
          import json
          r = json.load(open("result.json"))
          if not r["uploaded"]:
              print("The upload queue is empty. Make more episodes (docs/RUNBOOK.md)."); raise SystemExit
          for u in r["uploaded"]:
              print(f"- **{u['title']}**: {u.get('url', '')} (goes public {u['publish_at']} UTC)")
          print(f"\n{r['left']} videos left in the queue.")
          PY
          gh issue create --title "Scheduled $(date -u +%F): $(python -c "import json;print(len(json.load(open('result.json'))['uploaded']))") Shorts" --body-file body.md
